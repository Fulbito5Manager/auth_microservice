spring.application.name=auth
server.port=8085
#database config
spring.datasource.url=jdbc:postgresql://localhost:5437/auth_db
spring.datasource.username=auth_db_user
spring.datasource.password=auth_db_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#Swagger config:
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

security.jwt.key.private=${JWT_PRIVATE_KEY:this-key-must-be-replaced-by-private-key-pem}
security.jwt.key.public=${JWT_PUBLIC_KEY:this-key-must-be-replaced-by-public-key-pem}
security.jwt.user.generator=AUTHOJWT-BACKEND
logging.level.org.springframework.security=DEBUG

